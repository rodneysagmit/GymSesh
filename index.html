<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfdfb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GymSesh</title>
<style>
  :root { --bg:#fdfdfb; --ink:#1a1a1a; --muted:#6f6c66; --faint:#a3a099; --line:#e3e0d8; --field:#dcd9d1; --soft:#f1efe9;
    --g:oklch(0.6 0.15 150); --g-ink:oklch(0.4 0.13 150); --g-soft:oklch(0.6 0.15 150 / 0.14); --warn:#9a6b00; --warn-soft:#fbf0d2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Helvetica, Arial, sans-serif; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
  input, textarea, select, button { font-family: inherit; color: inherit; }
  ::placeholder { color: #b3b0aa; }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(60px + env(safe-area-inset-bottom, 0px)); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .title { font-size:22px; font-weight:700; letter-spacing:-0.01em; }
  .sub { font-size:12px; color:#8a8781; }
  .btn { border:1px solid #d8d5cd; background:#fff; color:var(--ink); font-size:12px; font-weight:600; padding:8px 10px; border-radius:7px; cursor:pointer; }
  .btn.dark { background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn.green { border-color:var(--g); background:oklch(0.6 0.15 150 / 0.1); color:var(--g-ink); }
  .btn.block { width:100%; font-size:13px; font-weight:700; padding:12px 0; border-radius:9px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .grid2 > * { min-width:0; }
  .row > .in { flex:1; min-width:0; }
  .in { border:1px solid var(--field); border-radius:7px; padding:8px; font-size:14px; background:#fff; width:100%; min-width:0; }
  textarea.in { resize: vertical; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--field); background:#fff; color:#4a4844; font-size:12px; font-weight:600; padding:7px 11px; border-radius:20px; cursor:pointer; }
  .chip.on, .en.on { background:var(--g-soft); color:var(--g-ink); border-color:var(--g); }
  .en { flex:1; border:1px solid var(--field); background:#fff; color:#4a4844; font-size:14px; font-weight:700; padding:9px 0; border-radius:8px; cursor:pointer; }
  .exhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .num { width:26px; height:26px; border-radius:7px; background:var(--g-soft); color:var(--g-ink); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .exname { flex:1; min-width:0; border:none; border-bottom:1px solid var(--field); padding:6px 2px; font-size:15px; font-weight:600; background:transparent; }
  .x { border:none; background:transparent; color:#b3b0aa; font-size:18px; line-height:1; padding:4px; cursor:pointer; }
  .setgrid { display:grid; grid-template-columns:26px 1fr 1fr 1fr 40px 20px; gap:6px; align-items:center; }
  .sethdr { font-size:10px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:0.02em; padding:0 2px 4px; text-align:center; }
  .setrow { margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--soft); }
  .setrow input.s { width:100%; min-width:0; border:1px solid var(--field); border-radius:6px; padding:7px 4px; font-size:14px; text-align:center; background:#fff; }
  .setrow.warm input.s { background:var(--warn-soft); }
  .setno { font-size:13px; font-weight:700; color:#8a8781; text-align:center; border:none; background:transparent; padding:4px 0; border-radius:6px; cursor:pointer; }
  .setrow.warm .setno { color:var(--warn); background:var(--warn-soft); }
  .setnote { width:100%; margin-top:5px; border:none; background:transparent; font-size:12px; color:var(--muted); padding:2px; }
  .prev { font-size:11px; color:var(--faint); margin:-4px 0 8px 34px; }
  .addset { border:1px dashed #d8d5cd; background:transparent; color:var(--muted); font-size:12px; font-weight:600; padding:6px 10px; border-radius:7px; margin-top:2px; cursor:pointer; }
  details.card summary { font-size:14px; font-weight:600; }
  .hint { text-align:center; font-size:11px; color:var(--faint); margin:6px 0 20px; }
  .banner { border:1px solid var(--g); background:oklch(0.6 0.15 150 / 0.08); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px; }
  .banner.warn { border-color:#e0c06a; background:var(--warn-soft); }
  .banner b { font-weight:700; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .hist-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--soft); font-size:13px; }
  .hist-item:last-child { border-bottom:0; }
  .pill { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 6px; border-radius:5px; }
  .pill.todo { background:var(--warn-soft); color:var(--warn); } .pill.done { background:var(--g-soft); color:var(--g-ink); }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; z-index:10; max-width:calc(100vw - 32px); }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--g); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<datalist id="exList"></datalist>
<script>
"use strict";
/* ---------- storage ---------- */
const KEY_DRAFT = "gymsesh.draft.v2", KEY_HIST = "gymsesh.history.v2";
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; // LA date, not UTC
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDay = iso => new Date(iso + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const $ = s => document.querySelector(s);

/* Canonical names (match workout-log.csv and Lift Dashboard) */
const EXERCISES = ["Bench Press (Barbell)", "Barbell Squat", "Deadlift", "Barbell Bent-Over Row", "Overhead Press", "Romanian Deadlift",
  "Dumbbell Bench Press", "Incline DB Bench Press", "Incline Bench Press (Barbell)", "DB Shoulder Press", "Lateral Raises (DB)", "Pec Flies Machine", "Chest Press Machine",
  "Tricep Rope Pushdown", "Overhead Cable Tricep Extension (Rope)", "Overhead Tricep Cable Extension (Single Arm)", "Overhead DB Extension",
  "Lat Pulldown", "Seated Cable Row", "Lever Row", "Rear Delt Fly", "Face Pulls", "Pull-ups", "EZ Bar Curl", "Bicep Curl Machine", "Dumbbell Hammer Curls",
  "Leg Press Machine", "Leg Extension Machine", "Seated Leg Curl", "Hamstring Curl Machine", "Adduction Machine", "Abduction Machine", "Goblet Squat", "Calf Raise", "Ab Crunch Machine"];
const FOCUS_OPTIONS = ["Push", "Pull", "Legs", "Upper Body", "Lower Body", "Full Body", "Cardio", "Mobility", "Custom"];

const emptySet = () => ({ weight: "", reps: "", rest: "", rpe: "", notes: "", warm: false });
const emptyExercise = n => ({ name: "", sets: Array.from({ length: n }, emptySet) });
const blankState = () => ({
  id: "w" + Date.now().toString(36),
  header: { date: localDate(), start: "", end: "", gym: "", focus: "", energy: 0, notes: "" },
  exercises: Array.from({ length: 4 }, () => emptyExercise(4)),
  optional: { bodyWeight: "", measurements: "", warmup: "", cardio: { type: "", duration: "", distance: "" }, stretch: "", prs: "", pain: "", summary: "" },
});

let S = load(KEY_DRAFT, null) || blankState();
let H = load(KEY_HIST, []); // [{id, savedAt, logged:false, state}]
// migrate drafts from before warm-up flags existed
S.exercises.forEach(e => e.sets.forEach(s => { if (s.warm == null) s.warm = false; }));
let saveT;
function persist() { clearTimeout(saveT); saveT = setTimeout(() => { if (!save(KEY_DRAFT, S)) toast("Couldn't save on this device. Copy your log before closing."); }, 250); }
function persistHist() { save(KEY_HIST, H); }

/* ---------- history-derived helpers ---------- */
function knownNames() { const s = new Set(EXERCISES); H.forEach(h => h.state.exercises.forEach(e => e.name && s.add(e.name.trim()))); return [...s].sort((a, b) => a.localeCompare(b)); }
function lastFor(name) {
  if (!name) return null; const k = name.trim().toLowerCase();
  for (let i = H.length - 1; i >= 0; i--) { const h = H[i]; if (h.id === S.id) continue; const e = h.state.exercises.find(x => (x.name || "").trim().toLowerCase() === k); if (e) return { date: h.state.header.date, sets: e.sets.filter(st => st.weight || st.reps) }; }
  return null;
}
function lastOfFocus(f) { for (let i = H.length - 1; i >= 0; i--) if (H[i].state.header.focus === f && H[i].id !== S.id) return H[i]; return null; }
const hasContent = st => st.exercises.some(e => e.name || e.sets.some(s => s.weight || s.reps));

/* ---------- text export (format read by /gym and Lift Dashboard) ---------- */
function toText(s) {
  const lines = ["WORKOUT LOG", `Date: ${s.header.date || "-"}`, `Time: ${s.header.start || "-"} to ${s.header.end || "-"}`, `Gym: ${s.header.gym || "-"}`, `Focus: ${s.header.focus || "-"}`, `Energy: ${s.header.energy || "-"}/5`];
  if (s.header.notes) lines.push(`Notes: ${s.header.notes}`);
  lines.push("", "EXERCISES");
  let n = 0;
  s.exercises.forEach(ex => {
    if (!ex.name && !ex.sets.some(st => st.weight || st.reps)) return;
    n++; lines.push(`${n}. ${ex.name || "(unnamed)"}`);
    let k = 0;
    ex.sets.forEach(st => {
      if (!st.weight && !st.reps && !st.rest && !st.rpe && !st.notes) return;
      k++; lines.push(`   Set ${k}${st.warm ? " (warm-up)" : ""}: ${st.weight || "-"} x ${st.reps || "-"} | rest ${st.rest || "-"} | RPE ${st.rpe || "-"}${st.notes ? " | " + st.notes : ""}`);
    });
  });
  const o = s.optional; lines.push("", "OPTIONAL");
  if (o.bodyWeight) lines.push(`Body weight: ${o.bodyWeight}`);
  if (o.measurements) lines.push(`Measurements: ${o.measurements}`);
  if (o.warmup) lines.push(`Warm-up: ${o.warmup}`);
  if (o.cardio.type || o.cardio.duration || o.cardio.distance) lines.push(`Cardio: ${o.cardio.type || "-"}, ${o.cardio.duration || "-"}, ${o.cardio.distance || "-"}`);
  if (o.stretch) lines.push(`Stretching: ${o.stretch}`);
  if (o.prs) lines.push(`PRs: ${o.prs}`);
  if (o.pain) lines.push(`Pain/form notes: ${o.pain}`);
  if (o.summary) lines.push(`Summary: ${o.summary}`);
  return lines.join("\n");
}

/* ---------- copy / share ---------- */
let toastT;
function toast(m) { let el = $("#toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }
async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); toast(msg || "Copied"); return true; }
  catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); toast(ok ? (msg || "Copied") : "Couldn't copy. Long-press to select instead."); return ok; }
}
async function shareText(t) { if (navigator.share) { try { await navigator.share({ text: t }); return true; } catch (e) { return false; } } return copyText(t); }
const canShare = () => !!navigator.share;

/* ---------- finish / history ---------- */
function finishWorkout() {
  if (!hasContent(S)) { toast("Log at least one set first."); return; }
  if (!S.header.end) S.header.end = nowHM();
  const snap = JSON.parse(JSON.stringify(S));
  const i = H.findIndex(h => h.id === S.id);
  const entry = { id: S.id, savedAt: new Date().toISOString(), logged: false, state: snap };
  if (i >= 0) H[i] = { ...entry, logged: H[i].logged }; else H.push(entry);
  H.sort((a, b) => (a.state.header.date + (a.state.header.start || "")).localeCompare(b.state.header.date + (b.state.header.start || "")));
  persistHist(); S = blankState(); persist(); view = "finished"; lastFinished = entry.id; render(); window.scrollTo(0, 0);
}
const unlogged = () => H.filter(h => !h.logged);
function markLogged(ids) { H.forEach(h => { if (ids.includes(h.id)) h.logged = true; }); persistHist(); render(); }

/* ---------- start from template ---------- */
function startFromLast(f) {
  const src = lastOfFocus(f); if (!src) return;
  S.header.focus = f; if (!S.header.gym) S.header.gym = src.state.header.gym || "";
  S.exercises = src.state.exercises.filter(e => e.name).map(e => ({ name: e.name, sets: e.sets.filter(st => st.weight || st.reps).map(st => ({ ...emptySet(), warm: !!st.warm })) }));
  persist(); render(); toast(`Loaded your last ${f} workout. Previous numbers show as hints.`);
}

/* ---------- render ---------- */
let view = "log", lastFinished = null;
function render() {
  const app = $("#app"); const active = document.activeElement; const fid = active && active.id; const pos = active && active.selectionStart;
  $("#exList").innerHTML = knownNames().map(n => `<option value="${esc(n)}">`).join("");
  app.innerHTML = view === "finished" ? finishedHTML() : view === "history" ? historyHTML() : logHTML();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} } }
}
function topBar(sub) {
  return `<div class="top"><div><div class="title">GymSesh</div><div class="sub">${sub}</div></div>
  <div class="row"><button class="btn" data-act="history">History${unlogged().length ? ` · ${unlogged().length}` : ""}</button>${view === "log" ? `<button class="btn" data-act="clear">Clear</button>` : `<button class="btn" data-act="back">Back</button>`}</div></div>`;
}
function nudgeHTML() {
  const u = unlogged(); const last = H.length ? H[H.length - 1].state.header.date : null; const since = last ? daysBetween(last, localDate()) : null;
  let out = "";
  if (u.length) out += `<div class="banner warn"><b>${u.length} workout${u.length === 1 ? "" : "s"} not logged yet.</b> Send ${u.length === 1 ? "it" : "them"} to Claude so your log and dashboard stay current.
    <div class="row" style="margin-top:8px"><button class="btn dark" data-act="${canShare() ? "share-unlogged" : "copy-unlogged"}">${canShare() ? "Share" : "Copy"} ${u.length === 1 ? "it" : "all " + u.length}</button>${canShare() ? `<button class="btn" data-act="copy-unlogged">Copy</button>` : ""}<button class="btn" data-act="mark-all">Mark as logged</button></div></div>`;
  else if (since != null && since > 3 && !hasContent(S)) out += `<div class="banner">Last workout: <b>${since} days ago</b> (${esc(H[H.length - 1].state.header.focus || "workout")}). Today's a good day.</div>`;
  return out;
}
function logHTML() {
  const s = S; const o = s.optional;
  const resumed = hasContent(s) && s.header.date !== localDate() ? `<div class="banner warn">This draft is from <b>${fmtDay(s.header.date)}</b>. Finish it, or tap Clear to start today's.</div>` : "";
  const lf = s.header.focus && !hasContent(s) ? lastOfFocus(s.header.focus) : null;
  return topBar(hasContent(s) ? "Saved on this phone as you type" : "Log as you lift") + nudgeHTML() + resumed + `
  <div class="card">
    <div class="grid2">
      <label class="field label">Date<input class="in" type="date" id="h-date" data-h="date" value="${esc(s.header.date)}"></label>
      <label class="field label">Gym / Location<input class="in" type="text" id="h-gym" data-h="gym" placeholder="e.g. EoS La Mirada" value="${esc(s.header.gym)}" list="gymList"></label>
      <label class="field label">Start Time<div class="row" style="flex-wrap:nowrap"><input class="in" type="time" id="h-start" data-h="start" value="${esc(s.header.start)}"><button class="btn" data-act="now" data-k="start" aria-label="Set start to now">Now</button></div></label>
      <label class="field label">End Time<div class="row" style="flex-wrap:nowrap"><input class="in" type="time" id="h-end" data-h="end" value="${esc(s.header.end)}"><button class="btn" data-act="now" data-k="end" aria-label="Set end to now">Now</button></div></label>
    </div>
    <datalist id="gymList">${[...new Set(H.map(h => h.state.header.gym).filter(Boolean).concat("EoS La Mirada", "Work Gym"))].map(g => `<option value="${esc(g)}">`).join("")}</datalist>
    <div style="margin-top:12px"><div class="label" style="margin-bottom:6px">Workout Focus</div>
      <div class="chips">${FOCUS_OPTIONS.map(f => `<button class="chip ${s.header.focus === f ? "on" : ""}" data-act="focus" data-k="${f}">${f}</button>`).join("")}</div>
      ${lf ? `<button class="btn green" style="margin-top:10px" data-act="from-last" data-k="${esc(s.header.focus)}">Start from last ${esc(s.header.focus)} (${fmtDay(lf.state.header.date)})</button>` : ""}
    </div>
    <div style="margin-top:12px"><div class="label" style="margin-bottom:6px">Overall Energy (1&ndash;5)</div>
      <div class="row" style="flex-wrap:nowrap">${[1, 2, 3, 4, 5].map(v => `<button class="en ${s.header.energy === v ? "on" : ""}" data-act="energy" data-k="${v}">${v}</button>`).join("")}</div></div>
    <label class="field label" style="margin-top:12px">Overall Workout Notes<textarea class="in" id="h-notes" data-h="notes" rows="2" placeholder="How did the session feel overall?">${esc(s.header.notes)}</textarea></label>
  </div>

  <div class="label" style="margin:18px 0 8px">Exercises</div>
  ${s.exercises.map((ex, i) => { const prev = lastFor(ex.name); return `
  <div class="card" style="padding:12px">
    <div class="exhead"><div class="num">${i + 1}</div>
      <input class="exname" type="text" id="ex-${i}" data-ex="${i}" placeholder="Exercise name" value="${esc(ex.name)}" list="exList" autocomplete="off">
      <button class="x" data-act="rm-ex" data-i="${i}" aria-label="Remove exercise">&times;</button></div>
    ${prev ? `<div class="prev">Last time (${fmtDay(prev.date)}): ${prev.sets.map(st => `${st.weight || "-"}×${st.reps || "-"}`).join(" · ")}</div>` : ""}
    <div class="setgrid sethdr"><div>Set</div><div>Weight</div><div>Reps</div><div>Rest</div><div>RPE</div><div></div></div>
    ${ex.sets.map((st, j) => { const p = prev && prev.sets[j]; return `
    <div class="setrow ${st.warm ? "warm" : ""}">
      <div class="setgrid">
        <button class="setno" data-act="warm" data-i="${i}" data-j="${j}" title="Tap to mark as warm-up" aria-label="Set ${j + 1}${st.warm ? ", warm-up" : ""}. Tap to toggle warm-up">${st.warm ? "W" : j + 1}</button>
        <input class="s" type="text" inputmode="decimal" id="w-${i}-${j}" data-s="${i}-${j}" data-k="weight" placeholder="${p ? esc(p.weight) : "lb"}" value="${esc(st.weight)}">
        <input class="s" type="text" inputmode="numeric" id="r-${i}-${j}" data-s="${i}-${j}" data-k="reps" placeholder="${p ? esc(p.reps) : "#"}" value="${esc(st.reps)}">
        <input class="s" type="text" id="t-${i}-${j}" data-s="${i}-${j}" data-k="rest" placeholder="90s" value="${esc(st.rest)}">
        <input class="s" type="text" inputmode="numeric" id="p-${i}-${j}" data-s="${i}-${j}" data-k="rpe" placeholder="-" value="${esc(st.rpe)}">
        <button class="x" style="font-size:15px;color:#c9c6bf" data-act="rm-set" data-i="${i}" data-j="${j}" aria-label="Remove set">&times;</button>
      </div>
      <input class="setnote" type="text" id="n-${i}-${j}" data-s="${i}-${j}" data-k="notes" placeholder="Set note (form, pain, PR...)" value="${esc(st.notes)}">
    </div>`; }).join("")}
    <div class="row"><button class="addset" data-act="add-set" data-i="${i}">+ Add Set</button>${ex.sets.some(st => st.weight || st.reps) ? `<button class="addset" data-act="copy-set" data-i="${i}">+ Repeat last set</button>` : ""}</div>
  </div>`; }).join("")}
  <button class="btn green block" style="margin-bottom:20px" data-act="add-ex">+ Add Exercise</button>

  <div class="label" style="margin:6px 0 8px">Optional</div>
  <details class="card"><summary>Body Weight &amp; Measurements</summary><div style="margin-top:10px;display:grid;gap:8px">
    <input class="in" type="text" id="o-bw" data-o="bodyWeight" placeholder="Body weight, e.g. 168 lb" value="${esc(o.bodyWeight)}">
    <input class="in" type="text" id="o-me" data-o="measurements" placeholder="Measurements, e.g. waist 33in, arm 15in" value="${esc(o.measurements)}"></div></details>
  <details class="card"><summary>Warm-up Notes</summary><textarea class="in" style="margin-top:10px" id="o-wu" data-o="warmup" rows="2" placeholder="What you did to warm up">${esc(o.warmup)}</textarea></details>
  <details class="card"><summary>Cardio Completed</summary><div class="grid2" style="margin-top:10px">
    <input class="in" type="text" id="o-ct" data-c="type" placeholder="Type, e.g. Incline walk" value="${esc(o.cardio.type)}">
    <input class="in" type="text" id="o-cd" data-c="duration" placeholder="Duration, e.g. 20 min" value="${esc(o.cardio.duration)}">
    <input class="in" type="text" id="o-cx" data-c="distance" placeholder="Distance (optional)" value="${esc(o.cardio.distance)}" style="grid-column:span 2"></div></details>
  <details class="card"><summary>Stretching / Mobility</summary><textarea class="in" style="margin-top:10px" id="o-st" data-o="stretch" rows="2" placeholder="What you stretched or mobilized">${esc(o.stretch)}</textarea></details>
  <details class="card"><summary>Personal Records</summary><textarea class="in" style="margin-top:10px" id="o-pr" data-o="prs" rows="2" placeholder="e.g. Bench 135lb x 5 - new PR">${esc(o.prs)}</textarea></details>
  <details class="card"><summary>Pain / Discomfort / Form Notes</summary><textarea class="in" style="margin-top:10px" id="o-pa" data-o="pain" rows="2" placeholder="Anything that hurt or felt off">${esc(o.pain)}</textarea></details>
  <details class="card" style="margin-bottom:20px"><summary>Workout Summary</summary><textarea class="in" style="margin-top:10px" id="o-su" data-o="summary" rows="2" placeholder="Quick recap for future you / Claude">${esc(o.summary)}</textarea></details>

  <button class="btn dark block" data-act="finish">Finish workout</button>
  <div class="hint">Saves it on this phone and adds it to your "not logged yet" list.</div>
  <div class="row" style="justify-content:center;margin-bottom:20px">${canShare() ? `<button class="btn" data-act="share-current">Share now</button>` : ""}<button class="btn" data-act="copy-current">Copy as Text</button></div>

  <details class="card"><summary class="small muted" style="font-weight:600">How to use this tracker</summary><div class="small" style="margin-top:10px;color:#4a4844">
    <b>Before:</b> pick your focus. If you've done it before, tap <i>Start from last</i> to load the same exercises with last time's numbers as hints.<br>
    <b>During:</b> log each set right away. Tap the set number to mark a warm-up. Everything saves on this phone as you type.<br>
    <b>After:</b> tap <i>Finish workout</i>, then <i>Share</i> it to Claude. Claude updates your log and the dashboard, and gives feedback.</div></details>
  <details class="card"><summary class="small muted" style="font-weight:600">Tips to improve over time</summary><div class="small" style="margin-top:10px;color:#4a4844">
    Keep RPE on the same 1&ndash;10 scale every session so trends are comparable. Log body weight weekly, not daily, same time of day. Pick exercise names from the suggestions so every session lines up in your log.</div></details>`;
}
function finishedHTML() {
  const e = H.find(h => h.id === lastFinished); if (!e) { view = "log"; return logHTML(); }
  const s = e.state; const sets = s.exercises.reduce((a, x) => a + x.sets.filter(st => (st.weight || st.reps) && !st.warm).length, 0);
  const wk = (() => { const d = new Date(); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return localDate(d); })();
  const thisWeek = new Set(H.filter(h => h.state.header.date >= wk).map(h => h.state.header.date)).size;
  return topBar("Workout saved") + `<div class="card" style="text-align:center;padding:22px 16px">
    <div class="label">Saved on this phone</div>
    <div style="font-size:26px;font-weight:700;margin:6px 0">${esc(s.header.focus || "Workout")} · ${fmtDay(s.header.date)}</div>
    <div class="muted small">${sets} working sets · ${thisWeek} workout${thisWeek === 1 ? "" : "s"} this week</div>
    <div class="row" style="justify-content:center;margin-top:16px">
      ${canShare() ? `<button class="btn dark" style="padding:12px 18px;font-size:14px" data-act="share-one" data-id="${e.id}">Share to Claude</button>` : ""}
      <button class="btn ${canShare() ? "" : "dark"}" style="padding:12px 18px;font-size:14px" data-act="copy-one" data-id="${e.id}">Copy as Text</button></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-act="mark-one" data-id="${e.id}">${e.logged ? "Logged ✓" : "I've sent it, mark as logged"}</button></div>
    <p class="small muted" style="margin:14px 0 0">Not sending it right now? It stays in your "not logged yet" list until you do.</p></div>
    <button class="btn green block" data-act="back">Start a new workout</button>`;
}
function historyHTML() {
  const items = [...H].reverse();
  return topBar(`${H.length} saved on this phone`) + nudgeHTML() + `<div class="card">${items.length ? items.map(h => { const s = h.state; return `
    <div class="hist-item"><div style="flex:1;min-width:0"><b>${esc(s.header.focus || "Workout")}</b> · ${fmtDay(s.header.date)}<div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.exercises.map(e => e.name).filter(Boolean).join(", "))}</div></div>
      <span class="pill ${h.logged ? "done" : "todo"}">${h.logged ? "Logged" : "Not logged"}</span>
      <button class="btn" data-act="copy-one" data-id="${h.id}">Copy</button>
      ${h.logged ? `<button class="btn" data-act="unmark-one" data-id="${h.id}" aria-label="Mark as not logged">↺</button>` : `<button class="btn" data-act="mark-one" data-id="${h.id}">✓</button>`}
      <button class="btn" data-act="del-one" data-id="${h.id}" aria-label="Delete from this phone">&times;</button></div>`; }).join("") : `<p class="muted small" style="margin:0">Finished workouts show up here.</p>`}</div>
    <p class="small muted">History lives in this browser on this phone. Your permanent record is workout-log.csv once Claude logs it.</p>`;
}

/* ---------- events ---------- */
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.h) { S.header[t.dataset.h] = t.value; persist(); return; }
  if (t.dataset.ex != null) { S.exercises[+t.dataset.ex].name = t.value; persist(); return; }
  if (t.dataset.s) { const [i, j] = t.dataset.s.split("-").map(Number); S.exercises[i].sets[j][t.dataset.k] = t.value; persist(); return; }
  if (t.dataset.o) { S.optional[t.dataset.o] = t.value; persist(); return; }
  if (t.dataset.c) { S.optional.cardio[t.dataset.c] = t.value; persist(); return; }
});
document.addEventListener("change", ev => { const t = ev.target; if (t.dataset.ex != null) render(); /* show "last time" hints for the chosen exercise */ if (t.dataset.h === "date") render(); });
let clearArmed = false, delArmed = null;
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j, id = b.dataset.id;
  const entry = id ? H.find(h => h.id === id) : null;
  switch (a) {
    case "focus": S.header.focus = S.header.focus === b.dataset.k ? "" : b.dataset.k; if (!S.header.start && S.header.focus) S.header.start = nowHM(); break;
    case "energy": S.header.energy = S.header.energy === +b.dataset.k ? 0 : +b.dataset.k; break;
    case "now": S.header[b.dataset.k] = nowHM(); break;
    case "from-last": startFromLast(b.dataset.k); return;
    case "add-ex": S.exercises.push(emptyExercise(4)); break;
    case "rm-ex": S.exercises.splice(i, 1); break;
    case "add-set": S.exercises[i].sets.push(emptySet()); break;
    case "copy-set": { const sets = S.exercises[i].sets; const last = [...sets].reverse().find(st => st.weight || st.reps); const nx = sets.find((st, k) => k > sets.indexOf(last) && !st.weight && !st.reps); const vals = { weight: last.weight, reps: last.reps, rest: last.rest }; if (nx) Object.assign(nx, vals); else sets.push({ ...emptySet(), ...vals }); break; }
    case "rm-set": S.exercises[i].sets.splice(j, 1); break;
    case "warm": S.exercises[i].sets[j].warm = !S.exercises[i].sets[j].warm; break;
    case "clear":
      if (hasContent(S) && !clearArmed) { clearArmed = true; b.textContent = "Tap again to clear"; setTimeout(() => { clearArmed = false; if (b.isConnected) b.textContent = "Clear"; }, 3000); return; }
      clearArmed = false; S = blankState(); break;
    case "finish": finishWorkout(); return;
    case "copy-current": copyText(toText(S)); return;
    case "share-current": shareText(toText(S)); return;
    case "copy-one": copyText(toText(entry.state)); return;
    case "share-one": if (await shareText(toText(entry.state))) { /* user chose a target */ } return;
    case "mark-one": entry.logged = true; persistHist(); render(); toast("Marked as logged"); return;
    case "unmark-one": entry.logged = false; persistHist(); render(); return;
    case "del-one": if (delArmed !== id) { delArmed = id; b.textContent = "Delete?"; setTimeout(() => { delArmed = null; if (b.isConnected) b.innerHTML = "&times;"; }, 3000); return; } H = H.filter(h => h.id !== id); persistHist(); render(); return;
    case "copy-unlogged": copyText(unlogged().map(h => toText(h.state)).join("\n\n"), `Copied ${unlogged().length} workout${unlogged().length === 1 ? "" : "s"}`); return;
    case "share-unlogged": shareText(unlogged().map(h => toText(h.state)).join("\n\n")); return;
    case "mark-all": markLogged(unlogged().map(h => h.id)); toast("All marked as logged"); return;
    case "history": view = "history"; render(); window.scrollTo(0, 0); return;
    case "back": view = "log"; render(); window.scrollTo(0, 0); return;
  }
  persist(); render();
});
document.addEventListener("visibilitychange", () => { if (document.hidden) save(KEY_DRAFT, S); });
window.addEventListener("pagehide", () => save(KEY_DRAFT, S));
render();
</script>
</body>
</html>
